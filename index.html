<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>AI Friend</title>
  <link rel="stylesheet" href="./style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet" />
</head>
<body>
  <header>
    <h1>💢 Sara • AI Friend</h1>
  </header>

  <main id="chat-body" class="chat-body">
    <!-- Messages will appear here -->
  </main>

  <div class="input-area">
    <button id="mic-btn" title="Speak to Sara 🎤">🎤</button>
    <input type="text" id="text-input" placeholder="Type something to Sara..." />
    <button id="send-btn" title="Send Message">📨</button>
  </div>

</body>
</html>
